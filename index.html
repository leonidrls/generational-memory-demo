<title>Generational Memory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
  /* Full-screen chat "app": the whole viewport is the messenger. Messages arrive live; Book of Life and settings are slide-over screens. Dusk-plum brand + warm gold; WhatsApp-style greens in the bubbles. */
  :root{
    --bg:#ece9f1; --surface:#ffffff; --panel:#faf8fc;
    --ink:#241f33; --ink-soft:#5d5572; --ink-faint:#8f879f;
    --brand:#6a4a9c; --brand-2:#8a63c9; --brand-weak:#efe7fb; --accent:#d99b2c;
    --chat-bg:#e7ddcf; --bubble-in:#ffffff; --bubble-out:#d6f2c4; --bubble-them:#fbeede;
    --wa:#13a05a; --rose:#c9617c; --line:rgba(30,20,50,.10); --shadow:rgba(40,25,70,.16);
    --sepia-b:#b6854a;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#14111c; --surface:#211b2c; --panel:#1c1727;
    --ink:#f0ebf7; --ink-soft:#b6acc8; --ink-faint:#897f9c;
    --brand:#5a3d87; --brand-2:#7b57b8; --brand-weak:#2a2240; --accent:#e6b24a;
    --chat-bg:#12100a; --bubble-in:#2a2335; --bubble-out:#1f3a29; --bubble-them:#30261c;
    --wa:#36c57f; --rose:#e089a0; --line:rgba(255,255,255,.11); --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#14111c; --surface:#211b2c; --panel:#1c1727;
    --ink:#f0ebf7; --ink-soft:#b6acc8; --ink-faint:#897f9c;
    --brand:#5a3d87; --brand-2:#7b57b8; --brand-weak:#2a2240; --accent:#e6b24a;
    --chat-bg:#12100a; --bubble-in:#2a2335; --bubble-out:#1f3a29; --bubble-them:#30261c;
    --wa:#36c57f; --rose:#e089a0; --line:rgba(255,255,255,.11); --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Rubik",system-ui,"Segoe UI",sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
  #app{height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden;
    display:flex;flex-direction:column;background:var(--chat-bg);box-shadow:0 0 40px var(--shadow)}

  /* app bar */
  .appbar{flex:none;background:var(--brand);color:#fff;display:flex;align-items:center;gap:11px;
    padding-inline:max(12px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-right,0px));padding-block:9px}
  .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,var(--brand-2),#b48ee6);
    display:grid;place-items:center;flex:none;color:#fff}
  .idname{flex:1;min-width:0}
  .idname .nm{font-weight:600;font-size:1rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .idname .st{font-size:.76rem;opacity:.85;height:1.1em;overflow:hidden}
  .barbtn{width:38px;height:38px;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;border-radius:50%;flex:none;position:relative}
  .barbtn:active{background:rgba(255,255,255,.15)}
  .barbtn .dot{position:absolute;top:7px;inset-inline-end:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--brand)}

  /* chat */
  .chat{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px;display:flex;flex-direction:column;gap:7px;
    background-image:radial-gradient(color-mix(in srgb,var(--sepia-b) 11%,transparent) 1.2px,transparent 1.2px);background-size:17px 17px}
  .composer{flex:none;display:flex;align-items:center;gap:9px;background:var(--surface);border-top:1px solid var(--line);
    padding-inline:max(10px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-right,0px));
    padding-block:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .composer .fld{flex:1;background:var(--chat-bg);border-radius:999px;padding:10px 15px;color:var(--ink-faint);font-size:.9rem;min-width:0}
  .composer .mic{width:40px;height:40px;border-radius:50%;background:var(--wa);display:grid;place-items:center;color:#fff;flex:none}

  /* bubbles */
  .msg{max-width:85%;padding:7px 10px 5px;border-radius:14px;font-size:.92rem;position:relative;
    box-shadow:0 1px 1.5px rgba(0,0,0,.08);word-wrap:break-word;animation:pop .32s cubic-bezier(.2,.8,.3,1) both}
  .msg.them{background:var(--bubble-in);border-top-left-radius:5px;align-self:flex-start}
  .msg.me{background:var(--bubble-out);border-top-right-radius:5px;align-self:flex-end}
  .msg.noa{background:var(--bubble-them);border-top-left-radius:5px;align-self:flex-start;border-inline-start:3px solid var(--rose)}
  [dir="rtl"] .msg.them,[dir="rtl"] .msg.noa{border-top-left-radius:14px;border-top-right-radius:5px}
  [dir="rtl"] .msg.me{border-top-right-radius:14px;border-top-left-radius:5px}
  .fwd{font-size:.72rem;font-weight:700;color:var(--rose);margin-bottom:3px;display:flex;align-items:center;gap:4px}
  .tm{font-size:.63rem;color:var(--ink-faint);text-align:end;margin-top:2px}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.msg{animation:none}}

  /* typing */
  .typing .dots{display:flex;gap:4px;padding:4px 2px}
  .typing .dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);animation:blink 1.3s infinite both}
  .typing .dots i:nth-child(2){animation-delay:.2s}.typing .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* voice note */
  .voice{display:flex;align-items:center;gap:9px}
  .voice .pl{width:28px;height:28px;border-radius:50%;background:var(--wa);display:grid;place-items:center;color:#fff;flex:none}
  .wave{flex:1;display:flex;align-items:center;gap:2px;height:22px;min-width:72px}
  .wave i{flex:1;background:color-mix(in srgb,var(--wa) 55%,var(--ink-faint));border-radius:2px;opacity:.6}
  .dur{font-size:.68rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .trans{margin-top:6px;padding-top:5px;border-top:1px dashed var(--line);font-size:.83rem;color:var(--ink-soft);font-style:italic}
  .trans .lbl{display:inline-block;font-style:normal;font-size:.58rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    color:var(--wa);background:color-mix(in srgb,var(--wa) 14%,transparent);padding:1px 5px;border-radius:5px;margin-bottom:3px}

  /* photo + clip */
  .photo,.clip{margin-top:4px;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:4/3;background:#000;max-width:100%}
  .photo svg,.clip svg{display:block;width:100%;height:100%}
  .clip .ken{width:100%;height:100%;transform-origin:60% 40%}
  .clip.live .ken{animation:ken 13s ease-in-out infinite alternate}
  @keyframes ken{from{transform:scale(1.03)}to{transform:scale(1.24) translate(-5%,4%)}}
  .clip .ovbtn{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.42);display:grid;place-items:center;color:#fff}
  .clip.live .ovbtn{opacity:0;transition:opacity .5s}
  .cap{position:absolute;inset-inline:0;bottom:0;padding:16px 10px 7px;font-size:.71rem;color:#fff;background:linear-gradient(transparent,rgba(20,10,5,.8));line-height:1.3}
  .clipmeta{position:absolute;top:7px;inset-inline-end:7px;font-size:.62rem;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:5px}
  @media (prefers-reduced-motion:reduce){.clip.live .ken{animation:none}}

  /* end pill */
  .endpill{align-self:center;margin:10px 0 4px;text-align:center}
  .endpill .lbl{font-size:.74rem;color:var(--ink-faint);margin-bottom:7px}
  .replay{border:0;background:var(--brand);color:#fff;font:inherit;font-weight:600;font-size:.88rem;padding:9px 18px;border-radius:999px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}

  /* overlays (book + sheet) */
  .screen{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;z-index:20;
    transform:translateX(100%);transition:transform .28s ease;visibility:hidden}
  [dir="rtl"] .screen{transform:translateX(-100%)}
  .screen.open{transform:none;visibility:visible}
  .schead{flex:none;background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;
    padding-inline:max(8px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px));padding-block:11px}
  .schead .ttl{font-weight:600;font-size:1.02rem}
  .scbody{flex:1;overflow-y:auto;padding:18px}
  .chevron{transform:scaleX(1)}
  [dir="rtl"] .chevron{transform:scaleX(-1)}

  .eyebrow{font-size:.67rem;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent)}
  .scbody h2{margin:5px 0 2px;font-size:1.28rem;font-weight:700}
  .scbody .sub{color:var(--ink-soft);font-size:.86rem;margin-bottom:16px}
  .chap{border-inline-start:3px solid var(--brand);padding-inline-start:13px}
  .chap .ct{font-size:.71rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
  .para{font-size:.98rem;line-height:1.6;color:var(--ink)}
  .ghost{color:var(--ink-faint);font-style:italic;font-size:.9rem}
  .card{display:flex;align-items:center;gap:11px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px}
  .card .th{width:56px;height:42px;border-radius:7px;overflow:hidden;flex:none;background:#000}
  .card .th svg{width:100%;height:100%;display:block}
  .card .kt{font-size:.82rem;font-weight:600}.card .ks{font-size:.7rem;color:var(--ink-soft)}
  .note{margin-top:14px;background:color-mix(in srgb,var(--rose) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--rose) 30%,transparent);border-radius:12px;padding:12px 13px}
  .note .nh{font-size:.72rem;font-weight:700;color:var(--rose);margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
  .note p{margin:0;font-size:.9rem}
  .note .plan{margin-top:8px;padding-top:8px;border-top:1px dashed color-mix(in srgb,var(--rose) 32%,transparent);font-weight:600;color:var(--ink)}
  .bookempty{color:var(--ink-faint);font-size:.9rem;font-style:italic;margin-top:30px;text-align:center}

  /* settings sheet */
  .sheetlabel{font-size:.72rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 8px}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;
    padding:9px 15px;border-radius:11px;cursor:pointer;display:flex;flex-direction:column;gap:1px;text-align:start}
  .opt b{font-weight:600}.opt span{font-size:.73rem;color:var(--ink-soft)}
  .opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-weak);color:var(--brand)}
  .demoNote{margin-top:26px;font-size:.78rem;color:var(--ink-faint);text-align:center;line-height:1.5}
  svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>

<div id="app">

</div>

  var chat=$('chat');

  function waveBars(n){var h=[6,12,18,10,22,14,8,16,20,11,15,9,19,13,7,17,10,21,12,8],o='';for(var i=0;i<n;i++)o+='<i style="height:'+h[i%h.length]+'px"></i>';return o}

  function msgHtml(m){
    var u=UI[lang], LS=story().L[lang];
    var cls='msg '+(m.who==='me'?'me':m.who==='noa'?'noa':'them');
    var h='<div class="'+cls+'">';

    if(m.voice){
      h+='<div class="voice"><span class="pl">'+PLAYIC+'</span><span class="wave">'+waveBars(16)+'</span><span class="dur">'+m.voice+'</span></div>';
      h+='<div class="trans"><span class="lbl">'+esc(u.trans)+'</span>'+esc(m.t[lang])+'</div>';
    } else h+=esc(m.t[lang]);
    if(m.photo) h+='<div class="photo">'+photoFor(m)+'</div>';
    if(m.clip) h+=clipHtml(LS.clipCap, LS.keepS.split(' ')[0]);
    h+='<div class="tm">'+m.tm+'</div></div>';
    return h;
  }

  function scrollDown(){chat.scrollTop=chat.scrollHeight}
  function setStatus(txt){$('pstatus').textContent=txt}

  function showTyping(who){
    var d=document.createElement('div');
    d.className='msg '+(who==='noa'?'noa':'them')+' typing'; d.id='typing';
    d.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
    chat.appendChild(d); scrollDown();
  }
  function hideTyping(){var t=$('typing'); if(t) t.remove()}

  function appendMsg(m){
    var d=document.createElement('div'); d.innerHTML=msgHtml(m); chat.appendChild(d.firstChild); scrollDown();
  }

  function events(){return story().msgs}
  var timer=null;
  function wait(ms,fn){var id=playId; clearTimeout(timer); timer=setTimeout(function(){if(id===playId) fn()},ms)}

  function pre(){
    var evs=events();
    if(ei>=evs.length){finish(); return;}
    var m=evs[ei], incoming=m.who!=='me'; shown=false;
    setStatus(incoming?UI[lang].typing:(m.voice?UI[lang].recording:UI[lang].typing));
    if(incoming) showTyping(m.who);
    wait(m.voice?1500:incoming?1150:1000, reveal);
  }
  function reveal(){
    if(shown) return; shown=true;
    var m=events()[ei];
    hideTyping(); setStatus(UI[lang].online);
    appendMsg(m); updateBookFor(m.step);
    wait((m.photo||m.clip)?1150:780, adv);
  }
  function adv(){ei++; pre()}

  function finish(){
    setStatus(UI[lang].online);
    var p=document.createElement('div'); p.className='endpill';
    p.innerHTML='<div class="lbl">'+esc(UI[lang].endNote)+'</div><button class="replay" id="endReplay"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg>'+esc(UI[lang].replay)+'</button>';
    chat.appendChild(p); scrollDown();
    $('endReplay').addEventListener('click',function(e){e.stopPropagation(); play()});
  }

  function play(){
    playId++; clearTimeout(timer); chat.innerHTML=''; ei=0; shown=false; bookSeen=false;
    revealedStep=0; $('bookDot').hidden=true; updateBookScreen();
    pre();
  }

  // skip on tap
  chat.addEventListener('click',function(){
    var evs=events(); if(ei>=evs.length) return;
    clearTimeout(timer);
    if(!shown) reveal(); else adv();
  });

    if(revealedStep>=6) h+='<div class="card"><span class="th">'+story().photo+'</span><div><div class="kt">'+esc(LS.keepT)+'</div><div class="ks">'+esc(LS.keepS)+'</div></div></div>';
    if(revealedStep>=8) h+='<div class="card"><span class="th">'+PHOTO_PORTRAIT+'</span><div><div class="kt">'+esc(u.famTitle)+'</div><div class="ks">'+esc(story().grand[lang])+'</div></div></div>';
    if(revealedStep>=8){ h+='<div class="note"><div class="nh">'+esc(u.noteH)+'</div><p>'+esc(LS.note)+'</p>'; if(revealedStep>=9) h+='<p class="plan">'+esc(LS.plan)+'</p>'; h+='</div>'; }
    $('bookBody').innerHTML=h;
  }
  function openScreen(id){ $(id).classList.add('open'); }
  function closeScreen(id){ $(id).classList.remove('open'); }
  $('bookBtn').addEventListener('click',function(){ bookSeen=true; $('bookDot').hidden=true; openScreen('book'); });
  $('bookBack').addEventListener('click',function(){ closeScreen('book'); });
  $('menuBtn').addEventListener('click',function(){ openScreen('sheet'); });
  $('sheetBack').addEventListener('click',function(){ closeScreen('sheet'); });
  $('replayBtn').addEventListener('click',function(){ closeScreen('sheet'); play(); });

  // ---- settings chrome ----
  function renderChrome(){
    var u=UI[lang];
    document.getElementById('app').dir=DIR[lang];
    $('pname').textContent=u.asst;
    $('pfield').textContent=u.field;
    $('bookHead').textContent=u.book;
    $('setHead').textContent=u.settings;
    $('lblLang').textContent=u.lang;
    $('lblStory').textContent=u.storyL;
    $('replayTxt').textContent=u.replay;
    $('demoNote').textContent=u.demoNote;
    $('av').innerHTML='<svg class="ic" viewBox="0 0 24 24" style="width:21px;height:21px"><path d="M12 7v13M8 4H5v13h3.5M12 7c0-2-1.4-3-3.5-3M16 4h3v13h-3.5M12 7c0-2 1.4-3 3.5-3"/></svg>';
    var langs=[['he','עברית'],['en','English'],['ru','Русский']], lh='';
    for(var i=0;i<langs.length;i++) lh+='<button class="opt" data-l="'+langs[i][0]+'" aria-pressed="'+(langs[i][0]===lang)+'"><b>'+langs[i][1]+'</b></button>';
    $('langOpts').innerHTML=lh;
    var sh='';
    for(var j=0;j<STORIES.length;j++) sh+='<button class="opt" data-s="'+j+'" aria-pressed="'+(j===si)+'"><b>'+esc(STORIES[j].sel[lang])+'</b><span>'+esc(STORIES[j].selSub[lang])+'</span></button>';
    $('storyOpts').innerHTML=sh;
    document.querySelectorAll('#langOpts .opt').forEach(function(b){b.addEventListener('click',function(){ lang=b.dataset.l; renderChrome(); play(); })});
    document.querySelectorAll('#storyOpts .opt').forEach(function(b){b.addEventListener('click',function(){ si=+b.dataset.s; renderChrome(); closeScreen('sheet'); play(); })});
  }

  renderChrome();
  play();
})();
</script>
