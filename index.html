<meta name="claude:viewport-fit-sides" content="cover">
<title>Generational Memory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
  /* Layout: a WhatsApp-style phone beside a growing "Book of Life", with a story switcher and a trilingual step-through narrating one memory loop. Dusk-plum brand + warm gold, WhatsApp greens inside the phone. */
  :root{
    --bg:#ece9f1; --surface:#ffffff; --panel:#faf8fc;
    --ink:#241f33; --ink-soft:#5d5572; --ink-faint:#8f879f;
    --brand:#6a4a9c; --brand-weak:#efe7fb; --accent:#d99b2c;
    --chat-bg:#e9e0d2; --bubble-in:#ffffff; --bubble-out:#d6f2c4; --bubble-them:#fbeede;
    --wa:#13a05a; --rose:#d1748a; --line:rgba(30,20,50,.10); --shadow:rgba(40,25,70,.14);
    --sepia-b:#b6854a;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#14111c; --surface:#211b2c; --panel:#1c1727;
    --ink:#f0ebf7; --ink-soft:#b6acc8; --ink-faint:#897f9c;
    --brand:#b89ae6; --brand-weak:#2a2240; --accent:#e6b24a;
    --chat-bg:#161219; --bubble-in:#2a2335; --bubble-out:#1f3a29; --bubble-them:#30261c;
    --wa:#36c57f; --rose:#e089a0; --line:rgba(255,255,255,.11); --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#14111c; --surface:#211b2c; --panel:#1c1727;
    --ink:#f0ebf7; --ink-soft:#b6acc8; --ink-faint:#897f9c;
    --brand:#b89ae6; --brand-weak:#2a2240; --accent:#e6b24a;
    --chat-bg:#161219; --bubble-in:#2a2335; --bubble-out:#1f3a29; --bubble-them:#30261c;
    --wa:#36c57f; --rose:#e089a0; --line:rgba(255,255,255,.11); --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);
    font-family:"Rubik",system-ui,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  #app{max-width:980px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:22px 34px}

  /* header */
  .head{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
  .brand{min-width:0}
  .wordmark{display:flex;align-items:center;gap:10px}
  .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--brand),#9b78d6);
    display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 3px 9px var(--shadow)}
  .wordmark b{font-size:1.28rem;font-weight:700;letter-spacing:.2px}
  .tag{color:var(--ink-soft);font-size:.9rem;margin-top:5px}
  .langs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:4px;box-shadow:0 2px 8px var(--shadow)}
  .langs button{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-weight:500;
    font-size:.86rem;padding:6px 13px;border-radius:999px;cursor:pointer}
  .langs button[aria-pressed="true"]{background:var(--brand);color:#fff}
  .langs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* story switcher */
  .stories{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .stories button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);
    background:var(--surface);border-radius:13px;padding:9px 16px;cursor:pointer;font:inherit;color:var(--ink);text-align:start}
  .stories button b{font-weight:600;font-size:.93rem}
  .stories button span{font-size:.74rem;color:var(--ink-soft)}
  .stories button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-weak)}
  .stories button[aria-pressed="true"] b{color:var(--brand)}
  .stories button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* narration */
  .narr{display:flex;align-items:center;gap:11px;background:var(--brand-weak);
    border:1px solid var(--line);border-radius:14px;padding:11px 15px;margin-bottom:18px;min-height:56px}
  .narr .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent)}
  .narr p{margin:0;font-size:.95rem;color:var(--ink);font-weight:500}

  /* stage */
  .stage{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start}
  @media(max-width:720px){.stage{grid-template-columns:1fr;gap:18px}}

  /* phone */
  .phone{background:var(--surface);border:1px solid var(--line);border-radius:30px;
    padding:10px;box-shadow:0 18px 44px var(--shadow);max-width:360px;margin-inline:auto;width:100%}
  .screen{border-radius:22px;overflow:hidden;background:var(--chat-bg);display:flex;flex-direction:column;height:520px}
  .phead{background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px;flex:none}
  .pav{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
  .phead .nm{font-weight:600;font-size:.97rem;line-height:1.15}
  .phead .st{font-size:.72rem;opacity:.85}
  .chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:9px;
    background-image:radial-gradient(color-mix(in srgb,var(--sepia-b) 10%,transparent) 1px,transparent 1px);
    background-size:16px 16px}
  .pinput{flex:none;display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--surface);border-top:1px solid var(--line)}
  .pinput .fld{flex:1;background:var(--chat-bg);border-radius:999px;padding:9px 14px;color:var(--ink-soft);font-size:.86rem;min-width:0}
  .pinput .mic{width:34px;height:34px;border-radius:50%;background:var(--wa);display:grid;place-items:center;color:#fff;flex:none}

  /* bubbles */
  .msg{max-width:86%;padding:8px 11px;border-radius:14px;font-size:.9rem;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.06);word-wrap:break-word}
  .msg.them{background:var(--bubble-in);border-top-left-radius:5px;margin-inline-end:auto}
  .msg.me{background:var(--bubble-out);border-top-right-radius:5px;margin-inline-start:auto}
  .msg.noa{background:var(--bubble-them);border-top-left-radius:5px;margin-inline-end:auto}
  .who{font-size:.72rem;font-weight:700;color:var(--brand);margin-bottom:2px}
  .msg.noa .who{color:var(--rose)}
  .msg .tm{font-size:.63rem;color:var(--ink-faint);text-align:end;margin-top:3px}
  .anim .msg.fresh{animation:pop .34s cubic-bezier(.2,.8,.3,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(7px) scale(.98)}to{opacity:1;transform:none}}

  /* voice note */
  .voice{display:flex;align-items:center;gap:9px}
  .voice .pl{width:26px;height:26px;border-radius:50%;background:var(--wa);display:grid;place-items:center;color:#fff;flex:none}
  .wave{flex:1;display:flex;align-items:center;gap:2px;height:22px;min-width:70px}
  .wave i{flex:1;background:color-mix(in srgb,var(--wa) 55%,var(--ink-faint));border-radius:2px;opacity:.65}
  .dur{font-size:.68rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .trans{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:.84rem;color:var(--ink-soft);font-style:italic}
  .trans .lbl{display:inline-block;font-style:normal;font-size:.6rem;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--wa);background:color-mix(in srgb,var(--wa) 14%,transparent);
    padding:1px 6px;border-radius:5px;margin-bottom:3px}

  /* photo + clip */
  .photo,.clip{margin-top:4px;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:4/3;background:#000;max-width:100%}
  .photo svg,.clip svg{display:block;width:100%;height:100%}
  .clip .ken{width:100%;height:100%;transform-origin:60% 40%}
  .anim .clip.live .ken{animation:ken 13s ease-in-out infinite alternate}
  @keyframes ken{from{transform:scale(1.02)}to{transform:scale(1.22) translate(-5%,4%)}}
  .clip .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .clip .ovbtn{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.42);backdrop-filter:blur(2px);display:grid;place-items:center;color:#fff}
  .clip.live .ov{opacity:0;transition:opacity .4s}
  .cap{position:absolute;inset-inline:0;bottom:0;padding:16px 10px 7px;font-size:.72rem;color:#fff;
    background:linear-gradient(transparent,rgba(20,10,5,.78));line-height:1.3}
  .clipmeta{position:absolute;top:7px;inset-inline-end:7px;font-size:.62rem;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:5px;font-variant-numeric:tabular-nums}

  /* book */
  .book{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 20px 22px;box-shadow:0 10px 30px var(--shadow);min-width:0}
  .eyebrow{font-size:.68rem;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
  .book h2{margin:6px 0 2px;font-size:1.3rem;font-weight:700;text-wrap:balance}
  .book .sub{color:var(--ink-soft);font-size:.86rem;margin-bottom:16px}
  .chap{border-inline-start:3px solid var(--brand);padding-inline-start:13px;margin-bottom:4px}
  .chap .ct{font-size:.72rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
  .para{font-size:.98rem;line-height:1.62;color:var(--ink);max-width:62ch}
  .ghost{color:var(--ink-faint);font-style:italic;font-size:.9rem}
  .reveal{animation:fade .5s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .keepsake{display:flex;align-items:center;gap:11px;margin-top:15px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px}
  .keepsake .th{width:54px;height:40px;border-radius:7px;overflow:hidden;flex:none;background:#000}
  .keepsake .th svg{width:100%;height:100%;display:block}
  .keepsake .kt{font-size:.8rem;font-weight:600}
  .keepsake .ks{font-size:.7rem;color:var(--ink-soft)}
  .note{margin-top:15px;background:color-mix(in srgb,var(--rose) 13%,var(--surface));
    border:1px solid color-mix(in srgb,var(--rose) 32%,transparent);border-radius:12px;padding:12px 13px}
  .note .nh{display:flex;align-items:center;gap:7px;font-size:.73rem;font-weight:700;color:var(--rose);margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
  .note p{margin:0;font-size:.9rem}
  .note .plan{margin-top:8px;padding-top:8px;border-top:1px dashed color-mix(in srgb,var(--rose) 35%,transparent);font-weight:600;color:var(--ink)}

  /* controls */
  .ctrls{margin-top:22px}
  .bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:999px;transition:width .4s ease}
  .ctrlrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
  .slabel{font-size:.86rem;color:var(--ink-soft);flex:1;min-width:150px}
  .slabel b{color:var(--ink);font-weight:600}
  .btns{display:flex;gap:8px}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;
    font-size:.88rem;padding:9px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--brand)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .foot{margin-top:20px;font-size:.76rem;color:var(--ink-faint);text-align:center}

  svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>

<div id="app">
  <div class="head">
    <div class="brand">
      <div class="wordmark">
        <span class="mk"><svg class="ic" viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M12 7v13M12 7c0-2-1.5-3-4-3H4v13h4c2.5 0 4 1 4 3M12 7c0-2 1.5-3 4-3h4v13h-4c-2.5 0-4 1-4 3"/></svg></span>
        <b id="brandName">Generational Memory</b>
      </div>
      <div class="tag" id="tagline"></div>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button data-l="he" lang="he">עברית</button>
      <button data-l="en" lang="en">English</button>
      <button data-l="ru" lang="ru">Русский</button>
    </div>
  </div>

  <div class="stories" id="stories" role="group" aria-label="Story"></div>

  <div class="narr"><span class="dot"></span><p id="narr"></p></div>

  <div class="stage">
    <div class="phone">
      <div class="screen">
        <div class="phead">
          <span class="pav" id="pav"></span>
          <div><div class="nm" id="pname"></div><div class="st" id="pstatus"></div></div>
        </div>
        <div class="chat" id="chat" aria-live="polite"></div>
        <div class="pinput"><div class="fld" id="pfield"></div>
          <span class="mic"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
        </div>
      </div>
    </div>

    <div class="book">
      <div class="eyebrow" id="bookEye"></div>
      <h2 id="bookTitle"></h2>
      <div class="sub" id="bookSub"></div>
      <div id="bookBody"></div>
    </div>
  </div>

  <div class="ctrls">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="ctrlrow">
      <div class="slabel" id="slabel"></div>
      <div class="btns">
        <button class="btn" id="back"></button>
        <button class="btn" id="play"></button>
        <button class="btn primary" id="next"></button>
      </div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>

        ru:'Даниэль увидел твою историю и добавил в книгу фото тебя и Дворы. Он написал: «научишь меня танго, чтобы сыграть вместе?» Он хочет научиться у тебя.'}},
      {th:'a',step:9,who:'me',tm:'08:54', t:{
        he:'שיביא את הגיטרה בשבת. אני עדיין זוכר כל תו. 🤍',
        en:'Tell him to bring the guitar on Saturday. I still remember every note. 🤍',
        ru:'Пусть принесёт гитару в субботу. Я всё ещё помню каждую ноту. 🤍'}}
    ]
  };

  var STORIES=[STORY_RIVKA,STORY_YOSEF];

  /* ---- state ---- */
  var TOTAL=9, cur=1, lang='he', si=0, playing=false, timer=null;
  var app=document.getElementById('app');
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function story(){return STORIES[si]}

  function waveBars(n){var h=[6,12,18,10,22,14,8,16,20,11,15,9,19,13,7,17,10,21,12,8];var o='';for(var i=0;i<n;i++){o+='<i style="height:'+h[i%h.length]+'px"></i>'}return o}

  function clipHtml(live,cap,meta){
    return '<div class="clip'+(live?' live':'')+'">'+
      '<div class="ken">'+story().photo+'</div>'+
      '<span class="clipmeta">'+(meta||'0:45')+'</span>'+
      '<div class="ov"><span class="ovbtn">'+PLAYIC+'</span></div>'+
      (cap?'<div class="cap">'+esc(cap)+'</div>':'')+'</div>';
  }

  function msgHtml(m,fresh){
    var u=UI[lang], LS=story().L[lang];
    var cls='msg '+(m.who==='me'?'me':m.who==='noa'?'noa':'them')+(fresh?' fresh':'');
    var h='<div class="'+cls+'">';
    if(m.who==='noa') h+='<div class="who">'+esc(m.name[lang])+'</div>';
    if(m.shared){
      h+='<div class="who">'+esc(u.asst)+'</div>'+clipHtml(cur>=8&&STEP_THREAD[cur-1]==='f', LS.clipCap, LS.keepS.split(' ')[0]);
      h+='<div style="font-size:.85rem;margin-top:5px">'+esc(m.t[lang])+'</div>';
      h+='<div class="tm">'+m.tm+'</div></div>';return h;
    }
    if(m.voice){
      h+='<div class="voice"><span class="pl">'+PLAYIC+'</span><span class="wave">'+waveBars(16)+'</span><span class="dur">'+m.voice+'</span></div>';
      h+='<div class="trans"><span class="lbl">'+esc(u.trans)+'</span>'+esc(m.t[lang])+'</div>';
    } else {
      h+=esc(m.t[lang]);
    }
    if(m.photo) h+='<div class="photo">'+(m.famphoto?PHOTO_PORTRAIT:story().photo)+'</div>';
    if(m.clip) h+=clipHtml(cur===6&&STEP_THREAD[cur-1]==='a', LS.clipCap, LS.keepS.split(' ')[0]);
    h+='<div class="tm">'+m.tm+'</div></div>';
    return h;
  }

  function renderChat(){
    var u=UI[lang], thread=STEP_THREAD[cur-1];
    var vis=story().msgs.filter(function(m){return m.th===thread && m.step<=cur});
    var out='';
    for(var i=0;i<vis.length;i++){out+=msgHtml(vis[i], vis[i].step===cur)}
    var c=$('chat'); c.innerHTML=out; c.scrollTop=c.scrollHeight;
    $('pname').textContent = thread==='f'? u.fam : u.asst;
    $('pstatus').textContent = thread==='f'? '' : u.online;
    $('pav').innerHTML = thread==='f'
      ? '<svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.3"/><path d="M4 19c0-3 2.5-5 5-5s5 2 5 5M14.5 19c.3-2 1.8-3.3 3.5-3.3S21 17 21 19"/></svg>'
      : '<svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M12 7v13M8 4H5v13h3.5M12 7c0-2-1.4-3-3.5-3M16 4h3v13h-3.5M12 7c0-2 1.4-3 3.5-3"/></svg>';
  }

  function renderBook(){
    var u=UI[lang], LS=story().L[lang], h='';
    h+='<div class="chap"><div class="ct">'+esc(LS.chapter)+'</div>';
    if(cur>=5){ h+='<p class="para reveal">'+esc(LS.para)+'</p>'; }
    else { h+='<p class="ghost">'+esc(LS.ghost)+'</p>'; }
    h+='</div>';
    if(cur>=6){
      h+='<div class="keepsake reveal"><span class="th">'+story().photo+'</span><div><div class="kt">'+esc(LS.keepT)+'</div><div class="ks">'+esc(LS.keepS)+'</div></div></div>';
    }
    if(cur>=8){
      h+='<div class="keepsake reveal"><span class="th">'+PHOTO_PORTRAIT+'</span><div><div class="kt">'+esc(u.famTitle)+'</div><div class="ks">'+esc(story().grand[lang])+'</div></div></div>';
    }
    if(cur>=8){
      h+='<div class="note reveal"><div class="nh"><svg class="ic" viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor"><path d="M12 21s-7-4.3-9.5-8.5C1 9 3 5.5 6.5 5.5c2 0 3.2 1.1 3.5 2 .3-.9 1.5-2 3.5-2C19 5.5 23 9 21.5 12.5 19 16.7 12 21 12 21z"/></svg>'+esc(u.noteH)+'</div>';
      h+='<p>'+esc(LS.note)+'</p>';
      if(cur>=9) h+='<p class="plan">'+esc(LS.plan)+'</p>';
      h+='</div>';
    }
    $('bookBody').innerHTML=h;
  }

  function renderStories(){
    var out='';
    for(var i=0;i<STORIES.length;i++){
      out+='<button data-s="'+i+'" aria-pressed="'+(i===si)+'"><b>'+esc(STORIES[i].sel[lang])+'</b><span>'+esc(STORIES[i].selSub[lang])+'</span></button>';
    }
    $('stories').innerHTML=out;
    document.querySelectorAll('#stories button').forEach(function(b){
      b.addEventListener('click',function(){ var n=+b.dataset.s; if(n===si)return; stopPlay(); si=n; cur=1; render(); });
    });
  }

  function render(){
    var u=UI[lang], LS=story().L[lang];
    app.dir=DIR[lang];
    $('brandName').textContent=u.brand;
    $('tagline').textContent=LS.tag;
    $('bookEye').textContent=u.bookEye;
    $('bookTitle').textContent=u.bookTitle;
    $('bookSub').textContent=LS.bookSub;
    $('pfield').textContent=u.field;
    $('foot').textContent=u.foot;
    $('narr').textContent=u.narr[cur-1];
    $('fill').style.width=(cur/TOTAL*100)+'%';
    $('slabel').innerHTML='<b>'+u.step+' '+cur+' '+u.of+' '+TOTAL+'</b> · '+esc(u.labels[cur-1]);
    $('back').textContent=u.back; $('back').disabled=cur===1;
    $('next').textContent = cur===TOTAL? u.restart : u.next;
    $('play').textContent = playing? u.pause : u.play;
    renderStories(); renderChat(); renderBook();
    document.querySelectorAll('.langs button').forEach(function(b){b.setAttribute('aria-pressed', b.dataset.l===lang)});
  }

  function go(n){ cur=Math.max(1,Math.min(TOTAL,n)); render(); }
  function stopPlay(){ playing=false; if(timer){clearInterval(timer);timer=null} $('play').textContent=UI[lang].play; }
  function startPlay(){
    if(cur===TOTAL) cur=1;
    playing=true; $('play').textContent=UI[lang].pause; render();
    timer=setInterval(function(){ if(cur>=TOTAL){stopPlay();return} cur++; render(); }, 4200);
  }

  $('next').addEventListener('click',function(){ stopPlay(); if(cur===TOTAL){go(1)}else{go(cur+1)} });
  $('back').addEventListener('click',function(){ stopPlay(); go(cur-1); });
  $('play').addEventListener('click',function(){ if(playing){stopPlay()}else{startPlay()} });
  document.querySelectorAll('.langs button').forEach(function(b){
    b.addEventListener('click',function(){ lang=b.dataset.l; render(); });
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      var fwd=(e.key==='ArrowRight'); if(DIR[lang]==='rtl') fwd=!fwd;
      stopPlay(); go(cur+(fwd?1:-1));
    }
  });

  app.classList.add('anim');
  render();
})();
</script>
